{% extends 'mailing/base.html' %}
{% block title %}Повторная активация{% endblock %}
{% block content %}
<div class="container mt-5 col-md-6">
  <h2 class="mb-3">Повторная отправка письма активации</h2>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-warning mt-2" type="submit">Отправить повторно</button>
  </form>

  <p class="mt-3"><a href="{% url 'users:login' %}">Назад к входу</a></p>
</div>
{% endblock %}
