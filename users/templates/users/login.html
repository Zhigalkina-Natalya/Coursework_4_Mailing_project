{% extends 'mailing/base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="container mt-5 col-md-6">
  <h2 class="mb-3">Вход</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary mt-2" type="submit">Войти</button>
  </form>
  <p class="mt-3">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>
  <p class="mt-2">Не пришло письмо активации? <a href="{% url 'users:resend_activation' %}">Отправить повторно</a></p>
</div>
{% endblock %}
