{% extends 'mailing/base.html' %}
{% block content %}

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}

  <a class="btn btn-secondary" href="{% url 'mailing:mailing_list' %}">Отмена</a>
</form>
{% endblock %}
