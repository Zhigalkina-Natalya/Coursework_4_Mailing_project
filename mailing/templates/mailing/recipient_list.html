{% extends 'mailing/base.html' %}
{% block title %}Получатели{% endblock %}
{% block content %}
<h1>Получатели</h1>
<a class="btn btn-primary mb-3" href="{% url 'mailing:recipient_add' %}">Добавить получателя</a>
<table class="table table-striped">
  <thead><tr><th>Email</th><th>ФИО</th><th></th></tr></thead>
  <tbody>
    {% for r in object_list %}
    <tr>
      <td>{{ r.email }}</td>
      <td>{{ r.full_name }}</td>
      <td>
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'mailing:recipient_edit' r.pk %}">Редактировать</a>
        <a class="btn btn-sm btn-outline-danger" href="{% url 'mailing:recipient_delete' r.pk %}">Удалить</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="3">Список пуст.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
