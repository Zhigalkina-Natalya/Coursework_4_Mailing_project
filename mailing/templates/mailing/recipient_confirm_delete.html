{% extends 'mailing/base.html' %}
{% block content %}
<h1>Удалить получателя</h1>
<p>Вы уверены, что хотите удалить {{ object.email }}?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Да, удалить</button>
  <a class="btn btn-secondary" href="{% url 'mailing:recipient_list' %}">Отмена</a>
</form>
{% endblock %}
